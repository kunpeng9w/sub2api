log_format sub2api_public '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name idontknow.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://idontknow.site$request_uri; }
}

server {
    listen 443 ssl;
    server_name idontknow.site;
    ssl_certificate /etc/letsencrypt/live/idontknow.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idontknow.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Sub2API_TLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/sub2api.access.log sub2api_public;
    error_log /var/log/nginx/sub2api.error.log warn;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
