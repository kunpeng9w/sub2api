name: Egress policy simulation

on:
  push:
    branches: [codex/strict-egress-policy, codex/account-proxy-priority]
  workflow_dispatch:
    inputs:
      network_only:
        description: 'Only mock network transitions and parse manual commands (application source unchanged)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: egress-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v6
        if: ${{ !inputs.network_only }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Format candidate source only
        if: ${{ !inputs.network_only }}
        run: |
          git diff --name-only -z HEAD^ HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - name: Compile and run simulated account egress regressions
        if: ${{ !inputs.network_only }}
        working-directory: backend
        env:
          GOMAXPROCS: '2'
          CGO_ENABLED: '0'
        run: |
          set -o pipefail
          go test -v -tags unit -p 1 -count=1 ./internal/config ./internal/pkg/claudedomain ./internal/service ./internal/repository ./internal/handler ./internal/handler/admin ./internal/server/routes -run 'TestStrictEgress|TestClaudeEgress|TestOfficialClaudeDomain' -timeout 10m 2>&1 | tee "$RUNNER_TEMP/egress-go-tests.log"
      - name: Simulate network policy and manual deployment transitions
        run: |
          set -o pipefail
          python -m unittest discover -s ops/changes/20261028-egress-policy -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/egress-policy-tests.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: egress-simulation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/egress-go-tests.log
            ${{ runner.temp }}/egress-policy-tests.log
          if-no-files-found: warn

  frontend:
    if: ${{ !inputs.network_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Simulated egress policy UI
        run: pnpm --dir frontend exec vitest run src/components/account/__tests__/AccountProxyField.spec.ts
