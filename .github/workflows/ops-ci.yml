name: Source and operations verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build the embedded program without running tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-status:
    if: ${{ !inputs.build_only }}
    name: Independent network monitor and read-only PostgreSQL adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: network-status-ci
          POSTGRES_DB: network_status_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the monitor runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y curl postgresql-client
      - name: Verify monitor behavior without public network requests
        env:
          NETWORK_STATUS_TEST_PG: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: network_status_test
          PGUSER: postgres
          PGPASSWORD: network-status-ci
          PYTHONDONTWRITEBYTECODE: '1'
        run: bash ops/changes/20261105-channel-monitor/test-isolated.sh python3 -m unittest discover -s ops/network-status -p 'test_*.py' -v

  operations:
    if: ${{ !inputs.build_only }}
    name: Operations configuration and existing unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python ops/scripts/check-repository.py
      - name: Existing egress control and installer tests (isolated mocks)
        working-directory: ops/scripts/egress-guard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest -v test_state.py test_install.py

  mihomo-dns:
    if: ${{ !inputs.build_only }}
    name: Mihomo DNS lifecycle with real systemd and dnsmasq
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install DNS fixture dependency
        run: sudo apt-get update && sudo apt-get install -y dnsmasq-base
      - name: Verify lifecycle without contacting public upstreams
        run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 ops/scripts/mihomo-dns/test_lifecycle.py -v

  egress-audit:
    if: ${{ !inputs.build_only }}
    name: Egress audit integration and routing regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Audit component race checks
        run: bash ops/changes/20261101-egress-audit/test-isolated.sh -race -v
      - name: Verify audit integration and existing transport semantics
        working-directory: backend
        env:
          GOMAXPROCS: '2'
        run: |
          set -o pipefail
          go test -v -tags=unit -p 1 -count=1 ./internal/service ./internal/repository ./internal/server/middleware ./internal/pkg/egresstrace ./internal/pkg/tlsfingerprint \
            -run 'TestPhaseObservation|TestFingerprintEgressTrace|TestEgressAudit|TestStrictEgress|TestClaudeEgress|TestAccountEgress|TestOpenAIWSConnPool|TestOpenAIWSConnLease|TestHTTPUpstreamCompletedBody|TestHTTPUpstreamCancellation|TestHTTPUpstreamHTTP2Close' \
            -timeout 10m 2>&1 | tee "$RUNNER_TEMP/egress-audit-tests.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: egress-audit-tests-${{ github.sha }}
          path: ${{ runner.temp }}/egress-audit-tests.log
          if-no-files-found: warn

  embedded-build:
    name: Frontend template tests and embedded Linux amd64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify the production template changes and existing catalog behavior
        if: ${{ !inputs.build_only }}
        run: |
          set -o pipefail
          pnpm --dir frontend exec vitest run src/components/keys/__tests__/UseKeyModal.spec.ts 2>&1 | tee "$RUNNER_TEMP/template-tests.log"
      - name: Verify network status access, interaction and frontend conventions
        if: ${{ !inputs.build_only }}
        run: |
          pnpm --dir frontend exec vitest run src/views/user/__tests__/NetworkStatusView.spec.ts
          pnpm --dir frontend exec eslint src/api/networkStatus.ts src/views/user/NetworkStatusView.vue src/views/user/__tests__/NetworkStatusView.spec.ts src/i18n/locales/en/networkStatus.ts src/i18n/locales/zh/networkStatus.ts
      - name: Build frontend before the backend embeds it
        run: |
          if [ "${{ inputs.build_only }}" = "true" ]; then
            pnpm --dir frontend exec vue-tsc -b
            pnpm --dir frontend exec vite build
          else
            pnpm --dir frontend run build
          fi
      - name: Build the matching source with actual provenance
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          source_version=$(./scripts/resolve-version.sh)
          source_commit=$(git rev-parse HEAD)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -mod=readonly -tags=embed -trimpath \
            -ldflags "-s -w -X main.Version=$source_version -X main.Commit=$source_commit -X main.Date=$build_date -X main.BuildType=source" \
            -o "$RUNNER_TEMP/sub2api" ./cmd/server
          "$RUNNER_TEMP/sub2api" -version > "$RUNNER_TEMP/version.txt" 2>&1
          grep -F "Sub2API $source_version (commit: $source_commit, built: $build_date)" "$RUNNER_TEMP/version.txt"
          printf '%s\n' "$build_date" > "$RUNNER_TEMP/build-date.txt"
          go version -m "$RUNNER_TEMP/sub2api"
          sha256sum "$RUNNER_TEMP/sub2api"
      - name: Package the embedded Linux amd64 program
        run: |
          mkdir -p "$RUNNER_TEMP/delivery"
          tar -czf "$RUNNER_TEMP/delivery/sub2api-linux-amd64.tar.gz" -C "$RUNNER_TEMP" sub2api
          if [ -f "$RUNNER_TEMP/template-tests.log" ]; then
            cp "$RUNNER_TEMP/template-tests.log" "$RUNNER_TEMP/delivery/"
          else
            printf 'Tests skipped: build_only workflow input enabled.\n' > "$RUNNER_TEMP/delivery/tests-skipped.txt"
          fi
          cp "$RUNNER_TEMP/version.txt" "$RUNNER_TEMP/delivery/version.txt"
          go version -m "$RUNNER_TEMP/sub2api" > "$RUNNER_TEMP/delivery/build-provenance.txt"
          (cd "$RUNNER_TEMP" && sha256sum sub2api) > "$RUNNER_TEMP/delivery/sub2api.sha256"
          source_version=$(backend/scripts/resolve-version.sh)
          cd "$RUNNER_TEMP/delivery"
          sha256sum sub2api-linux-amd64.tar.gz > SHA256SUMS
          printf 'source_version=%s\nsource_commit=%s\nbuild_date=%s\nbuild_type=source\nactions_run=%s/%s/actions/runs/%s\n' \
            "$source_version" "$GITHUB_SHA" "$(cat "$RUNNER_TEMP/build-date.txt")" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt
          sha256sum -c SHA256SUMS
      - name: Require a clean source tree after the embedded build
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 7
