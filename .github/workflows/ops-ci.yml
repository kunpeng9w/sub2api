name: Source and operations verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operations:
    name: Operations configuration and existing unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python ops/scripts/check-repository.py
      - name: Existing egress control and installer tests (isolated mocks)
        working-directory: ops/scripts/egress-guard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest -v test_state.py test_install.py

  embedded-build:
    name: Frontend template tests and embedded Linux amd64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify the production template changes and existing catalog behavior
        run: |
          set -o pipefail
          pnpm --dir frontend exec vitest run src/components/keys/__tests__/UseKeyModal.spec.ts 2>&1 | tee "$RUNNER_TEMP/template-tests.log"
      - name: Build frontend before the backend embeds it
        run: pnpm --dir frontend run build
      - name: Build the matching source with actual provenance
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          source_commit=$(git rev-parse HEAD)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -mod=readonly -tags=embed -trimpath \
            -ldflags "-s -w -X main.Version=0.2.18 -X main.Commit=$source_commit -X main.Date=$build_date -X main.BuildType=source" \
            -o "$RUNNER_TEMP/sub2api" ./cmd/server
          "$RUNNER_TEMP/sub2api" -version
          go version -m "$RUNNER_TEMP/sub2api"
          sha256sum "$RUNNER_TEMP/sub2api"
      - name: Package the embedded Linux amd64 program
        run: |
          mkdir -p "$RUNNER_TEMP/delivery"
          tar -czf "$RUNNER_TEMP/delivery/sub2api-linux-amd64.tar.gz" -C "$RUNNER_TEMP" sub2api
          cp "$RUNNER_TEMP/template-tests.log" "$RUNNER_TEMP/delivery/"
          cd "$RUNNER_TEMP/delivery"
          sha256sum sub2api-linux-amd64.tar.gz > SHA256SUMS
          printf 'source_commit=%s\nactions_run=%s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 7

  temporary-delivery:
    name: Temporary SSH delivery for the requested build
    needs: embedded-build
    if: ${{ always() && github.ref == 'refs/heads/build/codex-model-catalog' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        if: ${{ needs.embedded-build.result == 'success' }}
        with:
          name: sub2api-linux-amd64-${{ github.sha }}
          path: delivery
      - name: Make the build result available through Git SSH
        env:
          BUILD_RESULT: ${{ needs.embedded-build.result }}
          DELIVERY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p delivery
          cd delivery
          jq -n --arg result "$BUILD_RESULT" --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{result: $result, source_commit: $commit, actions_run: $run}' > status.json
          git init -b delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Temporary delivery for $GITHUB_SHA [skip ci]"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth_header=$(printf 'x-access-token:%s' "$DELIVERY_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/build-artifacts/codex-model-catalog-$GITHUB_SHA"
