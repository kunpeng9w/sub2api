name: OpenAI usage refresh verification

on:
  push:
    branches: ['codex/openai-usage-refresh*']
  pull_request:
    paths:
      - '.github/workflows/openai-usage-refresh-ci.yml'
      - 'Makefile'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-usage-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Mock quota refresh, handler regressions and server compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check source formatting
        run: |
          files=(internal/service/account_usage_service.go internal/service/account_usage_service_test.go internal/service/account_usage_service_batch_test.go internal/service/account_usage_service_spark_shadow_test.go internal/service/account_usage_service_openai_refresh_test.go internal/service/account_test_service.go internal/service/account_test_service_codex_usage_test.go internal/service/openai_quota_service.go internal/service/openai_quota_auto_reset.go internal/service/ratelimit_service.go internal/service/wire.go cmd/server/wire_gen.go)
          unformatted=$(gofmt -l "${files[@]}")
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Verify quota queries and model fallback against mock upstreams
        id: service
        run: |
          set -o pipefail
          go test -json -tags=unit -p 1 -count=1 ./internal/service \
            -run 'Test(OpenAIUsageRefresh|ShouldRefreshOpenAI|AccountUsageService|GetOpenAIUsage|BuildCodexUsageProgress|BuildCodexSpark|QueryUsage|OpenAIQuota|ChannelMonitorQuota|ExtractOpenAIModelTest)' \
            -timeout 15m 2>&1 | tee "$RUNNER_TEMP/openai-usage-service.jsonl"
      - name: Verify handler contracts and snapshot persistence
        id: contracts
        run: |
          set -o pipefail
          go test -json -tags=unit -p 1 -count=1 ./internal/handler/admin ./internal/repository \
            -run 'Test.*(OpenAIQuota|OpenAIRefreshQuota|ResetQuota|ChannelMonitorQuota|CodexDisplaySnapshot)' \
            -timeout 10m 2>&1 | tee "$RUNNER_TEMP/openai-usage-contracts.jsonl"
      - name: Compile the server and dependency wiring
        id: compile
        run: |
          set -o pipefail
          go test -p 1 ./cmd/server -run '^$' -timeout 5m 2>&1 | tee "$RUNNER_TEMP/openai-usage-server.log"
      - name: Save backend summary
        if: always()
        env:
          SERVICE_RESULT: ${{ steps.service.outcome }}
          CONTRACTS_RESULT: ${{ steps.contracts.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
        run: |
          {
            echo '### OpenAI usage refresh backend'
            echo "Commit: $GITHUB_SHA"
            echo "- Mock quota and fallback regressions: $SERVICE_RESULT"
            echo "- Handler and repository contracts: $CONTRACTS_RESULT"
            echo "- Server compilation: $COMPILE_RESULT"
            echo 'Upstreams are local mocks; no real account credentials are configured.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openai-usage-backend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openai-usage-service.jsonl
            ${{ runner.temp }}/openai-usage-contracts.jsonl
            ${{ runner.temp }}/openai-usage-server.log
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Full typecheck, quota components and locale validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Check all frontend types
        id: typecheck
        run: |
          set -o pipefail
          pnpm --dir frontend run typecheck 2>&1 | tee "$RUNNER_TEMP/openai-usage-typecheck.log"
      - name: Test quota refresh components and monitor presentation
        id: components
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          make test-frontend-openai-usage 2>&1 | tee "$RUNNER_TEMP/openai-usage-components.log"
      - name: Verify locale completeness
        id: locales
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          pnpm --dir frontend run check:i18n 2>&1 | tee "$RUNNER_TEMP/openai-usage-locales.log"
      - name: Save frontend summary
        if: always()
        env:
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          COMPONENTS_RESULT: ${{ steps.components.outcome }}
          LOCALES_RESULT: ${{ steps.locales.outcome }}
        run: |
          {
            echo '### OpenAI usage refresh frontend'
            echo "Commit: $GITHUB_SHA"
            echo "- Full frontend typecheck: $TYPECHECK_RESULT"
            echo "- Quota components and monitor tests: $COMPONENTS_RESULT"
            echo "- Locale completeness: $LOCALES_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openai-usage-frontend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openai-usage-typecheck.log
            ${{ runner.temp }}/openai-usage-components.log
            ${{ runner.temp }}/openai-usage-locales.log
          if-no-files-found: warn
          retention-days: 14
